name: Engine checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: |
          for file in server.mjs core/*.mjs adapters/*.mjs web/*.mjs; do node --check "$file"; done
